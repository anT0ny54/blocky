# yaml-language-server: $schema=https://raw.githubusercontent.com/0xERR0R/blocky/main/docs/config.schema.json

upstreams:
  groups:
    default:
      - https://root.hagezi.org/dns-query
      - https://wurzn.hagezi.org/dns-query
      - https://juuri.hagezi.org/dns-query

  strategy: random
  timeout: 2s

bootstrapDns:
  - tcp+udp:1.1.1.1
  - tcp+udp:8.8.8.8

# The Go abuse guard owns the public HTTP listener on 4001 and forwards DoH to
# Blocky over loopback on 4002. Keep DNS available on loopback solely for Blocky's
# built-in container healthcheck; it is not publicly bound.
ports:
  dns: 127.0.0.1:5300
  http: 127.0.0.1:4002
  dohPath: /dns-query

# SnapDeploy deployments are expected to have IPv4 egress.
connectIPVersion: v4

caching:
  minTime: 5m
  maxTime: 1h
  # Larger bounded cache uses available RAM for more cache hits without
  # making cache growth attacker-controlled.
  maxItemsCount: 8192
  # Prefetching improves latency but causes extra upstream traffic and memory use.
  prefetching: false
  cacheTimeNegative: 30m

# Public DoH abuse protection is enforced by /app/guard using the client-IP +
# Host token bucket. Keep Blocky's own resolver-chain limiter disabled so the
# loopback hop cannot impose a second, host-agnostic quota.
rateLimit:
  enable: false
  rate: 0
  burst: 1
  ipv4Prefix: 32
  ipv6Prefix: 64

log:
  level: info

# Query logging is intentionally disabled.
queryLog:
  type: none
