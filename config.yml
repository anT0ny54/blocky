# yaml-language-server: $schema=https://raw.githubusercontent.com/0xERR0R/blocky/main/docs/config.schema.json

upstreams:
  groups:
    default:
      - https://root.hagezi.org/dns-query
      - https://wurzn.hagezi.org/dns-query
      - https://juuri.hagezi.org/dns-query

  strategy: random
  timeout: 2s

bootstrapDns:
  - tcp+udp:1.1.1.1
  - tcp+udp:8.8.8.8

# Do not enable DNS port 53 on SnapDeploy.
# The HTTPS reverse proxy will reach Blocky through port 4000.
ports:
  http: 4000

dohPath: /dns-query

# SnapDeploy deployments are expected to have IPv4 egress.
connectIPVersion: v4

caching:
  minTime: 5m
  maxTime: 1h
  # Bound memory growth on the 512 MB instance.
  maxItemsCount: 4096
  # Prefetching improves latency but causes extra upstream traffic and memory use.
  prefetching: false
  cacheTimeNegative: 30m

# Abuse protection for individual client IPs.
rateLimit:
  enable: true
  rate: 25
  burst: 50
  ipv4Prefix: 32
  ipv6Prefix: 64

# Query logging is intentionally disabled.
log:
  level: info
