# yaml-language-server: $schema=https://raw.githubusercontent.com/0xERR0R/blocky/main/docs/config.schema.json

upstreams:
  groups:
    default:
      - https://root.hagezi.org/dns-query
      - https://wurzn.hagezi.org/dns-query
      - https://juuri.hagezi.org/dns-query

  # SERVER_TIMEOUT: Blocky's external-upstream query deadline.
  strategy: random
  timeout: 6s

# Bootstrap the three configured DoH upstreams over HTTPS to their published
# fixed IPv4 addresses. This avoids /etc/resolv.conf and any unrelated plaintext
# DNS resolver for upstream hostname lookup.
bootstrapDns:
  - upstream: https://root.hagezi.org/dns-query
    ips:
      - 188.34.161.210
  - upstream: https://wurzn.hagezi.org/dns-query
    ips:
      - 159.69.155.94
  - upstream: https://juuri.hagezi.org/dns-query
    ips:
      - 95.217.163.17

# The Go abuse guard owns the public HTTP listener on 4001 and forwards DoH to
# Blocky over loopback on 4002. Keep DNS available on loopback solely for Blocky's
# built-in container healthcheck; it is not publicly bound.
ports:
  dns: 127.0.0.1:5300
  http: 127.0.0.1:4002
  dohPath: /dns-query

# SnapDeploy deployments are expected to have IPv4 egress.
connectIPVersion: v4

caching:
  minTime: 5m
  maxTime: 1h
  # Bounded cache for the 512 MB profile. Blocky's maxItemsCount is a soft
  # entry-count limit; Blocky v0.35.0 has no per-entry byte-size knob.
  maxItemsCount: 8192
  # Prefetching improves latency but causes extra upstream traffic and memory use.
  prefetching: false
  cacheTimeNegative: 30m

# Public DoH abuse protection is enforced by /app/guard before Blocky.
# There is intentionally no request-rate token bucket or resolver-chain rate limiter.
# Resource protection is bounded by accepted connections, source-IP concurrency,
# request size, backend connection count, timeouts, and DNS response validation.

log:
  level: warn

# Query logging is intentionally disabled.
queryLog:
  type: none
